[versions]
kotlin                  = "2.0.21"
ksp                     = "2.0.21-1.0.28"
agp                     = "8.7.3"
compose-bom             = "2024.12.01"
room                    = "2.7.0"
hilt                    = "2.52"
hilt-navigation-compose = "1.2.0"
camerax                 = "1.4.1"
mlkit-barcode           = "17.3.0"
navigation-compose      = "2.8.4"
datastore               = "1.1.1"
accompanist-permissions = "0.37.0"
coil                    = "3.0.4"
zxing-core              = "3.5.3"
coroutines              = "1.9.0"
lifecycle               = "2.8.7"
splash-screen           = "1.0.1"
google-fonts            = "1.7.6"
ktlint                  = "12.1.2"

[libraries]
core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.13.1" }
# Compose
compose-bom                  = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui                   = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics          = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview   = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3            = { group = "androidx.compose.material3", name = "material3" }
compose-google-fonts         = { group = "androidx.compose.ui", name = "ui-text-google-fonts", version.ref = "google-fonts" }
activity-compose             = { group = "androidx.activity", name = "activity-compose" }

# Room
room-runtime   = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx       = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler  = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Hilt
hilt-android           = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler          = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

# CameraX
camerax-core     = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2  = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-view     = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# ML Kit
mlkit-barcode = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkit-barcode" }

# Navigation
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

# DataStore
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Accompanist
accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist-permissions" }

# Coil
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }

# ZXing
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing-core" }

# Coroutines
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test    = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Lifecycle / ViewModel
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-ktx       = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

# Splash Screen
splash-screen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splash-screen" }

# Testing
room-testing  = { group = "androidx.room", name = "room-testing", version.ref = "room" }
junit         = { group = "junit", name = "junit", version = "4.13.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ktlint              = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
